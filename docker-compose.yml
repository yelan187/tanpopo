services:
  napcat:
    container_name: napcat
    environment:
      - TZ=Asia/Shanghai
      - NAPCAT_UID=${NAPCAT_UID}
      - NAPCAT_GID=${NAPCAT_GID} 
    ports:
      - 3000:3000
      - 3001:3001
      - 6099:6099
    restart: unless-stopped
    volumes:
      - napcatQQ:/app/.config/QQ # 持久化 QQ 本体
      - napcatCONFIG:/app/napcat/config # 持久化 NapCat 配置文件
    image: mlikiowa/napcat-docker:latest

  tanpopo:
    container_name: tanpopo
    build:
      context: .
    depends_on:
      - napcat
    environment:
      - ENV=DOCKER
      - TZ=Asia/Shanghai
    restart: unless-stopped
    volumes:
      - napcatCONFIG:/napcat
      - ./config.yaml:/tanpopo/config.yaml
      - ./.agents:/tanpopo/.agents
      - ./.agent_runtime:/tanpopo/.agent_runtime
      - ./tmp:/tanpopo/tmp

volumes:
  napcatQQ:
  napcatCONFIG:
