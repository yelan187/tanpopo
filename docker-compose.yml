services:
  napcat:
    container_name: napcat
    environment:
      - TZ=Asia/Shanghai
      - NAPCAT_UID=${NAPCAT_UID}
      - NAPCAT_GID=${NAPCAT_GID} 
    ports:
      - 3000:3000
      - 3001:3001
      - 6099:6099
    restart: unless-stopped
    volumes:
      - napcatQQ:/app/.config/QQ # 持久化 QQ 本体
      - napcatCONFIG:/app/napcat/config # 持久化 NapCat 配置文件
    image: mlikiowa/napcat-docker:latest

  tanpopo:
    container_name: tanpopo
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.zju.edu.cn/pypi/web/simple}
    depends_on:
      - napcat
    environment:
      - ENV=DOCKER
      - TZ=Asia/Shanghai
      - LITELLM_LOCAL_MODEL_COST_MAP=True
      - LITELLM_LOG=ERROR
      - OPENHANDS_SUPPRESS_BANNER=1
      - FASTMCP_SHOW_SERVER_BANNER=false
      - FASTMCP_LOG_LEVEL=ERROR
    ports:
      - 8080:8080
    restart: unless-stopped
    volumes:
      - napcatCONFIG:/napcat
      - ./config.yaml:/tanpopo/config.yaml
      - ./.git:/tanpopo/.git
      - ./.agents:/tanpopo/.agents
      - ./.agent_runtime:/tanpopo/.agent_runtime
      - ./agent_workspace:/tanpopo/agent_workspace
      - ${TANPOPO_HOST_WORKSPACE:-./agent_workspace}:/tanpopo/host_workspace
      - ./tmp:/tanpopo/tmp

volumes:
  napcatQQ:
  napcatCONFIG:
