http_settings:
  host: "127.0.0.1"
  port: 3000

ws_settings:
  host: "127.0.0.1"
  port: 3001
  role: "client"

llm_auth:
  api_key: "your_api_key"
  base_url: "http://host.docker.internal:7700/v1"

agent_config:
  runtime: "openhands"
  gateway:
    enabled: true
    allowed_sessions: [] # 例如 ["private:123456", "group:233"]
    allowed_private_users: []
    allowed_groups: []
    allow_private_without_list: false
  openhands:
    model: "gpt-5.4"
    workspace: "."
    system_prompt: ""
    condenser:
      enabled: true
      max_size: 80
      max_tokens: 120000
      keep_first: 2
      minimum_progress: 0.1
    # 常规 MCP/skill 插拔由 .agent_runtime/*.yaml 管理。
    # 这里仅放需要覆盖启动参数或环境变量的 MCP。
    mcp_servers:
      qqio:
        transport: "stdio"
        command: "" # 留空时默认使用当前 Python
        args: ["-m", "src.mcp.qqio"]
        cwd: "."
        env: {}

log_level: "INFO"
