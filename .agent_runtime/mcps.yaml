servers:
  qqio:
    enabled: true
    transport: stdio
    command: ""
    args:
      - -m
      - src.mcp.qqio
    cwd: "."
    env: {}
    description: QQ/OneBot messaging and common query tools.
  fetch:
    enabled: true
    transport: stdio
    command: mcp-server-fetch
    args:
      - --ignore-robots-txt
    cwd: "."
    env:
      PYTHONIOENCODING: utf-8
    description: Official fetch MCP server for retrieving webpages as markdown.
  filesystem:
    enabled: false
    transport: stdio
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-filesystem'
      - /
    cwd: "."
    env: {}
    description: Official filesystem MCP server with full container filesystem access.
  workspace:
    enabled: true
    transport: stdio
    command: ""
    args:
      - -m
      - src.mcp.workspace
    cwd: "."
    env: {}
    description: Local bash command tool.
  capability:
    enabled: true
    transport: stdio
    command: ""
    args:
      - -m
      - src.mcp.capability
    cwd: "."
    env: {}
    description: Inspect enabled MCPs, skills, and runtime state.
  context:
    enabled: true
    transport: stdio
    command: ""
    args:
      - -m
      - src.mcp.context
    cwd: "."
    env: {}
    description: Inspect and close short-term Core contexts.
  plugin_manager:
    enabled: true
    transport: stdio
    command: ""
    args:
      - -m
      - src.mcp.plugin_manager
    cwd: "."
    env: {}
    description: Manage skill and MCP runtime registry entries.
  git_ops:
    enabled: true
    transport: stdio
    command: ""
    args:
      - -m
      - src.mcp.git_ops
    cwd: "."
    env:
      TANPOPO_GIT_ALLOWED_PATHS: .agents/skills,.agents/mcps
    description: Controlled git status, commit, branch, and push tools.
